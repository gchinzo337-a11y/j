<!DOCTYPE html>
<html lang="mn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Хичээлийн хуваарь</title><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{background:#f7f8fa}
body{font-family:"Segoe UI",sans-serif;margin:0 auto;max-width:900px;padding:20px;background:#f7f8fa;color:#1c2430}
h1{margin:0 0 16px}
.box{background:#fff;border:1px solid #d9dee5;border-radius:8px;padding:16px;margin-bottom:16px}
.scroll{overflow-x:auto;background:#fff;border:1px solid #d9dee5;border-radius:8px;margin-bottom:16px}
table{border-collapse:collapse;width:100%}
.scroll table{min-width:720px}
th,td{border:1px solid #e3e7ec;padding:8px;text-align:left;vertical-align:top;font-size:14px}
th{background:#0f766e;color:#fff}
.time{font-weight:600;background:#f0f4f3;white-space:nowrap}
.lesson{background:#d9efeb;border-left:4px solid #0f766e;border-radius:4px;padding:5px 7px}
.lesson b{display:block}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px}
input,select{padding:8px;border:1px solid #b8c0ca;border-radius:5px;font:inherit;width:100%;box-sizing:border-box}
button{background:#0f766e;color:#fff;border:0;border-radius:5px;padding:10px 14px;font:inherit;cursor:pointer}
.form button{align-self:end}
.btns{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.btns .grey{background:#5b6675}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f59e0b}
.result{background:#fff4d6;border-color:#f0d58a}
.result .tag{display:inline-block;font-size:12px;font-weight:600;background:#f59e0b;color:#1c2430;padding:2px 8px;border-radius:10px;margin-bottom:8px}
.result p{margin:4px 0;font-size:18px}
.result small{display:block;margin-top:8px;color:#5b6675}
.break td{background:#f3f4f6;color:#5b6675;font-size:12px;text-align:center;padding:3px}
.time small{display:block;font-weight:400;color:#5b6675}
.lesson{position:relative;margin-bottom:4px}
.lesson .del{position:absolute;top:3px;right:3px;padding:0 7px;line-height:20px;font-size:14px;background:#b42318;border-radius:4px}
.lesson b{padding-right:24px}
.bad{border-color:#b42318!important;background:#fef3f2}
.err{color:#b42318;font-size:14px;margin-top:10px;min-height:1em}
td.x{width:1%;white-space:nowrap}
.rm{background:#b42318;padding:8px 12px}
</style></head><body>
<h1>Хичээлийн хуваарь</h1>
<div class="scroll"><table>
<thead><tr><th>Цаг</th><th>Даваа</th><th>Мягмар</th><th>Лхагва</th><th>Пүрэв</th><th>Баасан</th></tr></thead>
<tbody id="body"></tbody></table></div>

<form class="box form" id="f">
<label>Хичээлийн нэр<input type="text" id="name" required></label>
<label>Гараг<select id="day"><option value="0">Даваа</option><option value="1">Мягмар</option><option value="2">Лхагва</option><option value="3">Пүрэв</option><option value="4">Баасан</option></select></label>
<label>Пар<select id="par"></select></label>
<label>Өрөө<input type="text" id="room" required></label>
<label>Багш<input type="text" id="teacher" required></label>
<button type="submit">Хичээл нэмэх</button>
</form>

<script>
const P=[["08:00","09:30"],["09:40","11:10"],["11:20","12:50"],["13:20","14:50"],["15:00","16:30"],["16:40","18:10"],["18:20","19:50"]];
const B=["09:30–09:40","11:10–11:20","12:50–13:20","14:50–15:00","16:30–16:40","18:10–18:20"];
let L=[
{n:"Математик",d:0,p:0,r:"201",t:"Б. Болд"},{n:"Физик",d:2,p:0,r:"210",t:"Г. Тэмүүлэн"},
{n:"Англи хэл",d:1,p:1,r:"112",t:"С. Анар"},{n:"Түүх",d:4,p:2,r:"105",t:"Ж. Ганаа"},
{n:"Программчлал",d:0,p:3,r:"305",t:"Д. Оюун"},{n:"Вэб хөгжүүлэлт",d:3,p:4,r:"306",t:"Н. Сарнай"}];
const body=document.getElementById("body"),par=document.getElementById("par");
P.forEach((x,i)=>par.add(new Option(`${i+1}-р пар (${x[0]}–${x[1]})`,i)));
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function draw(){
 body.innerHTML="";
 P.forEach((x,i)=>{
  const tr=el("tr"),th=el("td","time",`${i+1}-р пар`);
  th.appendChild(el("small","",`${x[0]}–${x[1]}`));tr.appendChild(th);
  for(let d=0;d<5;d++){
   const td=el("td");
   L.forEach((l,k)=>{
    if(l.d!==d||l.p!==i)return;
    const c=el("div","lesson");
    c.appendChild(el("b","",l.n));
    c.append(`${x[0]}–${x[1]}`,document.createElement("br"),`Өрөө ${l.r}`,document.createElement("br"),l.t);
    const b=el("button","del","×");b.type="button";b.title="Устгах";b.setAttribute("aria-label",`${l.n} хичээлийг устгах`);
    b.onclick=()=>{L.splice(k,1);draw()};
    c.appendChild(b);td.appendChild(c)});
   tr.appendChild(td)}
  body.appendChild(tr);
  if(i<6){const br=el("tr","break"),td=el("td","",`Завсарлага ${B[i]}`);td.colSpan=6;br.appendChild(td);body.appendChild(br)}
 })}
document.getElementById("f").addEventListener("submit",e=>{
 e.preventDefault();
 const v=id=>document.getElementById(id).value.trim();
 L.push({n:v("name"),d:+v("day"),p:+v("par"),r:v("room"),t:v("teacher")});
 draw();e.target.reset()});
draw();
</script></body></html>
